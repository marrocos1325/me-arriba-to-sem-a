<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>narutin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header2">se junte a nos!</header>
    <main>
        <form id="pao">
            <label for="nome">Nome</label>
            <input type="text" id="nome"  placeholder="Nome" required>

            <label for="end">CPF</label>
            <input type="number" id="end"  placeholder="000.000.000-00" required>

            <label for="tel">Telefone</label>
            <input type="number" id="tel"  placeholder="32 99999-9999" required maxlength="13">

            <label for="emal">Email</label>
            <input type="email" id="emal"  placeholder="exemplo@gmail.com" required>

            <label for="end">Endereço</label>
            <input type="text" id="end"  placeholder="Endereço" required>

            <label for="turno">Qual o turno de trabalho</label>
            <select>
                <option>Manha</option>
                <option>Tarde</option>
                <option>Noite</option>
            </select>

            <label for="cargo">Cargo</label>
            <select>
                <option>Faxineiro</option>
                <option>Caixa</option>
                <option>Gerente</option>
                <option>Repositor</option>
            </select>
            <button type="submit">Ser escravisado!</button>
        </form>
    </main>
    <footer>&copy 2026 todos os direito reservados. Arthur e Marcos</footer>
</body>
</html>
